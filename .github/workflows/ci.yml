# Build + unit tests. Present but DISABLED by default: automatic runs only happen once the
# repository variable HOTLINE_ACTIONS_ENABLED is set to 'true' (Settings → Secrets and variables →
# Actions → Variables). Manual "Run workflow" always works.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    if: ${{ vars.HOTLINE_ACTIONS_ENABLED == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Unit tests
        run: dotnet test --project tests/Hotline.Core.Tests/Hotline.Core.Tests.csproj -c Release

      - name: Build app (x64)
        run: dotnet build src/Hotline.App/Hotline.App.csproj -c Release -p:Platform=x64
