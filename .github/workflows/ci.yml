# Build + unit tests on every pull request and every push to main.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Unit tests
        run: dotnet test --project tests/Hotline.Core.Tests/Hotline.Core.Tests.csproj -c Release

      - name: Build unsigned MSIX
        shell: bash
        run: bash scripts/build-msix.sh --unsigned

      - name: Build app (x64)
        run: dotnet build src/Hotline.App/Hotline.App.csproj -c Release -p:Platform=x64

  # Windows on ARM: unit tests and the app build on a real ARM64 runner (native, not emulated).
  build-test-arm64:
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Unit tests
        run: dotnet test --project tests/Hotline.Core.Tests/Hotline.Core.Tests.csproj -c Release

      - name: Build app (ARM64)
        run: dotnet build src/Hotline.App/Hotline.App.csproj -c Release -p:Platform=ARM64 -r win-arm64
