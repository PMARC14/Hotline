# Builds the Microsoft Store package (unsigned x64 + ARM64 .msixbundle; the Store signs it) and, once set up,
# submits it to Partner Center with the Microsoft Store Developer CLI (msstore). Deliberate releases only:
#   - "Run workflow" with a version, e.g. 0.2.60 (the package version becomes 0.2.60.0), or
#   - pushing a tag vX.Y.Z by hand.
# A pull request that changes this workflow or the build script only test-builds the package (never submits).
# Every run uploads the package as a workflow artifact, so it can also be uploaded in Partner Center by hand.
# Submitting is OFF until the repository variable HOTLINE_STORE_SUBMIT is 'true'. Prerequisites (docs/RELEASING.md):
#   - the app is live in the Store (msstore only updates a published app; nothing may be in certification)
#   - variable STORE_PRODUCT_ID: the Store ID (Partner Center › Product identity, e.g. 9N…)
#   - secrets AZURE_AD_TENANT_ID, AZURE_AD_APPLICATION_CLIENT_ID, AZURE_AD_APPLICATION_SECRET, SELLER_ID
#     (an Entra app added in Partner Center › Account settings › Microsoft Entra applications with the Manager role)
name: Store

on:
  push:
    tags: ['v*']
  pull_request:
    paths: ['.github/workflows/store.yml', 'scripts/build-msix.sh']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, e.g. 0.2.60 (must be higher than the last Store version)'
        required: true
      submit:
        description: 'Submit to Partner Center (needs HOTLINE_STORE_SUBMIT = true; off = build the package only)'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  # Releases queue one at a time; pull-request test builds get their own group so they never displace a queued release.
  group: ${{ github.event_name == 'pull_request' && format('store-pr-{0}', github.run_id) || 'store' }}
  cancel-in-progress: false

env:
  # Partner Center › Hotline AI › Product identity (public values; the Store shows them on the listing).
  STORE_IDENTITY_NAME: PMARC14.HotlineAI
  STORE_PUBLISHER: CN=877AF4C8-D1A4-479F-B3BC-CDA1551986D1
  STORE_PUBLISHER_DISPLAY_NAME: PMARC14
  STORE_DISPLAY_NAME: Hotline AI

jobs:
  store:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash # Git Bash on the Windows runner; the scripts are bash (scripts/*.sh)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Unit tests
        run: dotnet test --project tests/Hotline.Core.Tests/Hotline.Core.Tests.csproj -c Release

      - name: Resolve version
        id: ver
        env: # through env, not ${{ }} in the script: a tag name is user text
          INPUT_VERSION: ${{ inputs.version }}
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          case $EVENT in
            workflow_dispatch) v=$INPUT_VERSION ;; # the version typed in, even when run on a tag
            pull_request) v="$(tr -d '\r\n' < version.txt)"; [[ $v =~ ^[0-9]+\.[0-9]+$ ]] && v="$v.0" ;; # test build only
            *) v=${REF_NAME#v} ;; # pushed tag vX.Y.Z
          esac
          [[ $v =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Version '$v' must look like 1.2.3"; exit 1; }
          echo "package=$v.0" >> "$GITHUB_OUTPUT" # Store versions end in .0

      - name: Build the Store package
        id: build
        run: |
          bundle=$(scripts/build-msix.sh --store --arch all --version '${{ steps.ver.outputs.package }}' \
            --identity-name "$STORE_IDENTITY_NAME" --publisher "$STORE_PUBLISHER" \
            --publisher-display-name "$STORE_PUBLISHER_DISPLAY_NAME" --display-name "$STORE_DISPLAY_NAME" | tail -1)
          [ -f "$bundle" ] || { echo "No package was built"; exit 1; }
          mkdir -p artifacts/store
          mv "$bundle" "artifacts/store/HotlineAI_${{ steps.ver.outputs.package }}_Store.msixbundle"
          echo "bundle=$(cygpath -w "$PWD/artifacts/store/HotlineAI_${{ steps.ver.outputs.package }}_Store.msixbundle")" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: hotline-store-${{ steps.ver.outputs.package }}
          path: artifacts/store/*.msixbundle

      - name: Should it submit?
        id: gate
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            echo "Pull request: test build only."
            echo "submit=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ vars.HOTLINE_STORE_SUBMIT }}" != true ]; then
            echo "Submitting is off (repository variable HOTLINE_STORE_SUBMIT); the package is in this run's artifacts."
            echo "submit=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = workflow_dispatch ] && [ "${{ inputs.submit }}" != true ]; then
            echo "submit=false" >> "$GITHUB_OUTPUT"
          elif [ -z "${{ vars.STORE_PRODUCT_ID }}" ]; then
            echo "::error::Set the repository variable STORE_PRODUCT_ID (the Store ID, e.g. 9N…)."; exit 1
          else echo "submit=true" >> "$GITHUB_OUTPUT"; fi

      - name: Set up the Microsoft Store CLI
        if: steps.gate.outputs.submit == 'true'
        uses: microsoft/microsoft-store-apppublisher@v1.1

      - name: Submit to Partner Center
        if: steps.gate.outputs.submit == 'true'
        env:
          TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          SELLER_ID: ${{ secrets.SELLER_ID }}
          CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
        run: |
          for s in TENANT_ID SELLER_ID CLIENT_ID CLIENT_SECRET; do
            [ -n "${!s}" ] || { echo "::error::Secret for $s is missing (see the top of this workflow)."; exit 1; }
          done
          msstore reconfigure --tenantId "$TENANT_ID" --sellerId "$SELLER_ID" --clientId "$CLIENT_ID" --clientSecret "$CLIENT_SECRET"
          # Uploads the package to a new submission (copying the live listing) and commits it for certification.
          msstore publish '${{ steps.build.outputs.bundle }}' -id '${{ vars.STORE_PRODUCT_ID }}'
