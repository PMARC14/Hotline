# Builds a signed MSIX and publishes a GitHub Release:
#   - every push to main (code changes): version.txt's major.minor plus the next patch in that line, e.g. 0.2.26
#     (scripts/next-version.sh; bumping version.txt to 0.3 starts at 0.3.0)
#   - a pushed tag vX.Y.Z, or "Run workflow" with a version: that version
# Signing, first match wins (details: docs/RELEASING.md):
#   1. Azure Artifact Signing (formerly Trusted Signing) — repository variables ARTIFACT_SIGNING_ENDPOINT,
#      ARTIFACT_SIGNING_ACCOUNT, ARTIFACT_SIGNING_PROFILE, HOTLINE_PUBLISHER (the certificate subject, exactly) and
#      AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID (an Entra app with a GitHub OIDC federated
#      credential and the "Artifact Signing Certificate Profile Signer" role; no secret stored). A normal release.
#   2. A .pfx — secrets HOTLINE_SIGNING_PFX_BASE64 / HOTLINE_SIGNING_PFX_PASSWORD (subject = manifest Publisher).
#   3. Neither: a throwaway self-signed certificate (users trust Hotline.cer first; the release notes say how).
name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['docs/**', '**/*.md', '.github/workflows/ci.yml', '.github/workflows/winget.yml']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 0.2.0 (empty = the next one: scripts/next-version.sh)'
        required: false
      publish:
        description: 'Publish the GitHub Release (off = build and upload the files only, e.g. to test a branch)'
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write # OIDC login for Azure Artifact Signing

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash # Git Bash on the Windows runner; the scripts are bash (scripts/*.sh)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Unit tests
        run: dotnet test --project tests/Hotline.Core.Tests/Hotline.Core.Tests.csproj -c Release

      - name: Resolve version
        id: ver
        env:
          # Passed as environment variables, never pasted into the script: a crafted tag or input can't inject shell.
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$REF_TYPE" = tag ]; then v="$REF_NAME"; v=${v#v}
          elif [ -n "$INPUT_VERSION" ]; then v="$INPUT_VERSION"
          else
            # The next patch in version.txt's line, from the existing tags (v0.2.25 → v0.2.26; 0.3 → v0.3.0).
            # Releases run one at a time (concurrency group), so two runs can't pick the same number.
            git fetch --tags --force --quiet
            v="$(scripts/next-version.sh)"
          fi
          [[ $v =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Version '$v' must look like 1.2.3"; exit 1; }
          echo "package=$v.0" >> "$GITHUB_OUTPUT"
          echo "tag=v$v" >> "$GITHUB_OUTPUT"

      - name: Signing mode
        id: mode
        env:
          SIGNING_ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          PUBLISHER: ${{ vars.HOTLINE_PUBLISHER }}
        run: |
          if [ -n "$SIGNING_ACCOUNT" ] && [ -n "$PUBLISHER" ]; then echo "artifact=true" >> "$GITHUB_OUTPUT"
          else echo "artifact=false" >> "$GITHUB_OUTPUT"; fi

      # ---- 1. Azure Artifact Signing --------------------------------------------------------------------
      - name: Build unsigned MSIX (Artifact Signing signs it)
        if: steps.mode.outputs.artifact == 'true'
        env:
          PACKAGE_VERSION: ${{ steps.ver.outputs.package }}
          PUBLISHER: ${{ vars.HOTLINE_PUBLISHER }}
        run: |
          msix=$(scripts/build-msix.sh --arch all --version "$PACKAGE_VERSION" --unsigned --publisher "$PUBLISHER" | tail -1)
          mkdir -p artifacts/to-sign
          mv "$msix" artifacts/to-sign/

      - name: Azure login (OIDC)
        if: steps.mode.outputs.artifact == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Sign with Azure Artifact Signing
        if: steps.mode.outputs.artifact == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}/artifacts/to-sign
          files-folder-filter: msixbundle
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Release files (Artifact Signing)
        if: steps.mode.outputs.artifact == 'true'
        env:
          PACKAGE_VERSION: ${{ steps.ver.outputs.package }}
          TAG: ${{ steps.ver.outputs.tag }}
          PUBLISHER: ${{ vars.HOTLINE_PUBLISHER }}
        run: |
          mv artifacts/to-sign/Hotline_*.msixbundle artifacts/
          # Trusted signing: users need no Hotline.cer, and updates through the .appinstaller just work.
          scripts/make-appinstaller.sh --version "$PACKAGE_VERSION" --tag "$TAG" \
            --msix-name "Hotline_$PACKAGE_VERSION.msixbundle" --out artifacts/Hotline.appinstaller \
            --publisher "$PUBLISHER" >/dev/null

      # ---- 2./3. .pfx or throwaway certificate ------------------------------------------------------------
      - name: Signing certificate
        id: cert
        if: steps.mode.outputs.artifact != 'true'
        env:
          PFX_BASE64: ${{ secrets.HOTLINE_SIGNING_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.HOTLINE_SIGNING_PFX_PASSWORD }}
        run: |
          mkdir -p certs
          if [ -n "$PFX_BASE64" ]; then
            printf '%s' "$PFX_BASE64" | base64 -d > certs/release.pfx
            password=$PFX_PASSWORD
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            # No signing secrets yet: a throwaway certificate with the manifest's Publisher, for test builds.
            scripts/dev-cert.sh --dir certs --no-trust
            mv certs/hotline-dev.pfx certs/release.pfx
            password=$(cat certs/hotline-dev.password)
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi
          echo "::add-mask::$password"
          echo "HOTLINE_CERT_PASSWORD=$password" >> "$GITHUB_ENV"

      - name: Build signed MSIX
        if: steps.mode.outputs.artifact != 'true'
        env:
          PACKAGE_VERSION: ${{ steps.ver.outputs.package }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          # x64 + ARM64 in one .msixbundle (artifacts/Hotline_<version>.msixbundle); Windows installs the right one.
          scripts/build-msix.sh --arch all --version "$PACKAGE_VERSION" --certificate certs/release.pfx >/dev/null
          # Public certificate so users of a self-signed build can trust it before installing
          # (-legacy reads .pfx files exported by older Windows tools).
          { openssl pkcs12 -in certs/release.pfx -nokeys -clcerts -passin env:HOTLINE_CERT_PASSWORD 2>/dev/null ||
            openssl pkcs12 -legacy -in certs/release.pfx -nokeys -clcerts -passin env:HOTLINE_CERT_PASSWORD; } |
            openssl x509 -outform der -out artifacts/Hotline.cer
          # Install + automatic updates: Windows re-reads the "latest" copy of this file from the releases.
          scripts/make-appinstaller.sh --version "$PACKAGE_VERSION" --tag "$TAG" \
            --msix-name "Hotline_$PACKAGE_VERSION.msixbundle" --out artifacts/Hotline.appinstaller >/dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: hotline-${{ steps.ver.outputs.tag }}
          path: |
            artifacts/Hotline_*.msixbundle
            artifacts/Hotline.cer
            artifacts/Hotline.appinstaller
          if-no-files-found: warn

      - name: Publish GitHub Release
        if: github.event_name != 'workflow_dispatch' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
          SHA: ${{ github.sha }}
          PRERELEASE: ${{ steps.cert.outputs.prerelease }}
        run: |
          # Every release is a normal ("latest") release; a self-signed one says how to trust it.
          flags=(--target "$SHA" --title "Hotline $TAG" --generate-notes --latest)
          if [ "$PRERELEASE" = true ]; then
            flags+=(--notes "Signed with a self-signed certificate: install Hotline.cer into Local Machine > Trusted People first (README › Install), then open the .msixbundle (x64 and ARM64). The Microsoft Store version (Hotline AI) needs none of this.")
          else flags+=(--notes ""); fi
          files=(artifacts/Hotline_*.msixbundle artifacts/Hotline.appinstaller)
          [ -f artifacts/Hotline.cer ] && files+=(artifacts/Hotline.cer) # only self-signed/.pfx builds need it
          gh release create "$TAG" "${files[@]}" "${flags[@]}"
