# Builds a signed MSIX and publishes a GitHub Release:
#   - every push to main (code changes): version <version.txt>.<run number>, e.g. 0.2.57
#   - a pushed tag vX.Y.Z, or "Run workflow" with a version: that version
# Signing, first match wins (details: docs/RELEASING.md):
#   1. Azure Artifact Signing (formerly Trusted Signing) — repository variables ARTIFACT_SIGNING_ENDPOINT,
#      ARTIFACT_SIGNING_ACCOUNT, ARTIFACT_SIGNING_PROFILE, HOTLINE_PUBLISHER (the certificate subject, exactly) and
#      AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID (an Entra app with a GitHub OIDC federated
#      credential and the "Artifact Signing Certificate Profile Signer" role; no secret stored). A normal release.
#   2. A .pfx — secrets HOTLINE_SIGNING_PFX_BASE64 / HOTLINE_SIGNING_PFX_PASSWORD (subject = manifest Publisher).
#   3. Neither: a throwaway self-signed certificate; published as a pre-release test build (trust Hotline.cer first).
name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['docs/**', '**/*.md', '.github/workflows/ci.yml', '.github/workflows/winget.yml']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 0.2.0 (empty = version.txt + run number)'
        required: false

permissions:
  contents: write
  id-token: write # OIDC login for Azure Artifact Signing

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Unit tests
        run: dotnet test --project tests/Hotline.Core.Tests/Hotline.Core.Tests.csproj -c Release

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $v = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}'.TrimStart('v') }
               elseif ('${{ inputs.version }}') { '${{ inputs.version }}' }
               else { "$((Get-Content version.txt -Raw).Trim()).${{ github.run_number }}" }
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Version '$v' must look like 1.2.3" }
          "package=$v.0" >> $env:GITHUB_OUTPUT
          "tag=v$v" >> $env:GITHUB_OUTPUT

      - name: Signing mode
        id: mode
        shell: pwsh
        run: |
          if ('${{ vars.ARTIFACT_SIGNING_ACCOUNT }}' -and '${{ vars.HOTLINE_PUBLISHER }}') { "artifact=true" >> $env:GITHUB_OUTPUT }
          else { "artifact=false" >> $env:GITHUB_OUTPUT }

      # ---- 1. Azure Artifact Signing --------------------------------------------------------------------
      - name: Build unsigned MSIX (Artifact Signing signs it)
        if: steps.mode.outputs.artifact == 'true'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $msix = & ./scripts/build-msix.ps1 -Version '${{ steps.ver.outputs.package }}' -Unsigned -Publisher '${{ vars.HOTLINE_PUBLISHER }}' | Select-Object -Last 1
          if (-not $msix) { throw 'No MSIX was produced' }
          New-Item -ItemType Directory -Force "$PWD/artifacts/to-sign" | Out-Null
          Copy-Item $msix "$PWD/artifacts/to-sign/Hotline_${{ steps.ver.outputs.package }}_x64.msix"

      - name: Azure login (OIDC)
        if: steps.mode.outputs.artifact == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Sign with Azure Artifact Signing
        if: steps.mode.outputs.artifact == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}/artifacts/to-sign
          files-folder-filter: msix
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Release files (Artifact Signing)
        if: steps.mode.outputs.artifact == 'true'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Move-Item "$PWD/artifacts/to-sign/Hotline_*.msix" "$PWD/artifacts/"
          # Trusted signing: users need no Hotline.cer, and updates through the .appinstaller just work.
          & ./scripts/make-appinstaller.ps1 -Version '${{ steps.ver.outputs.package }}' -Tag '${{ steps.ver.outputs.tag }}' `
            -MsixName 'Hotline_${{ steps.ver.outputs.package }}_x64.msix' -Out "$PWD/artifacts/Hotline.appinstaller" -Publisher '${{ vars.HOTLINE_PUBLISHER }}' | Out-Null

      # ---- 2./3. .pfx or throwaway certificate ------------------------------------------------------------
      - name: Signing certificate
        id: cert
        if: steps.mode.outputs.artifact != 'true'
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.HOTLINE_SIGNING_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.HOTLINE_SIGNING_PFX_PASSWORD }}
        run: |
          New-Item -ItemType Directory -Force certs | Out-Null
          $pfx = "$PWD\certs\release.pfx"
          if ($env:PFX_BASE64) {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_BASE64))
            $password = $env:PFX_PASSWORD
            "prerelease=false" >> $env:GITHUB_OUTPUT
          } else {
            # No signing secrets yet: a throwaway certificate with the manifest's Publisher, for test builds.
            [xml]$manifest = Get-Content src\Hotline.App\Package.appxmanifest -Raw
            $cert = New-SelfSignedCertificate -Type Custom -Subject $manifest.Package.Identity.Publisher -KeyUsage DigitalSignature `
              -CertStoreLocation 'Cert:\CurrentUser\My' -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}') -NotAfter (Get-Date).AddYears(1)
            $password = [Convert]::ToBase64String([Security.Cryptography.RandomNumberGenerator]::GetBytes(24))
            Export-PfxCertificate -Cert $cert -FilePath $pfx -Password (ConvertTo-SecureString $password -AsPlainText -Force) | Out-Null
            "prerelease=true" >> $env:GITHUB_OUTPUT
          }
          "::add-mask::$password"
          "HOTLINE_CERT_PASSWORD=$password" >> $env:GITHUB_ENV

      - name: Build signed MSIX
        if: steps.mode.outputs.artifact != 'true'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $msix = & .\scripts\build-msix.ps1 -Version '${{ steps.ver.outputs.package }}' -CertificatePath "$PWD\certs\release.pfx" | Select-Object -Last 1
          if (-not $msix) { throw 'No MSIX was produced' }
          Copy-Item $msix "$PWD\artifacts\Hotline_${{ steps.ver.outputs.package }}_x64.msix"
          # Public certificate so users of a self-signed build can trust it before installing.
          $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2("$PWD\certs\release.pfx", $env:HOTLINE_CERT_PASSWORD)
          [IO.File]::WriteAllBytes("$PWD\artifacts\Hotline.cer", $cert.Export('Cert'))
          # Install + automatic updates: Windows re-reads the "latest" copy of this file from the releases.
          & .\scripts\make-appinstaller.ps1 -Version '${{ steps.ver.outputs.package }}' -Tag '${{ steps.ver.outputs.tag }}' `
            -MsixName 'Hotline_${{ steps.ver.outputs.package }}_x64.msix' -Out "$PWD\artifacts\Hotline.appinstaller" | Out-Null

      - uses: actions/upload-artifact@v4
        with:
          name: hotline-${{ steps.ver.outputs.tag }}
          path: |
            artifacts/Hotline_*.msix
            artifacts/Hotline.cer
            artifacts/Hotline.appinstaller
          if-no-files-found: warn

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = if ('${{ steps.cert.outputs.prerelease }}' -eq 'true') {
            "Test build, signed with a temporary self-signed certificate: install Hotline.cer into Local Machine > Trusted People first, then open the .msix."
          } else { "" }
          $flags = @('--target', '${{ github.sha }}', '--title', 'Hotline ${{ steps.ver.outputs.tag }}', '--generate-notes', '--notes', $notes)
          if ('${{ steps.cert.outputs.prerelease }}' -eq 'true') { $flags += '--prerelease' } else { $flags += '--latest' }
          $files = @((Get-ChildItem artifacts/Hotline_*.msix).FullName, 'artifacts/Hotline.appinstaller')
          if (Test-Path artifacts/Hotline.cer) { $files += 'artifacts/Hotline.cer' } # only self-signed/.pfx builds need it
          gh release create '${{ steps.ver.outputs.tag }}' @files @flags
